name: Vercel and AWS

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'frontend/app/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend/app/

    steps:
      # 1. Retrieve the deposit code
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/app/package-lock.json'
        
      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Lancer le Lint
      - name: Run Lint
        run: npm run lint

      # 5. Lancer les tests Vitest
      - name: Run Vitest
        run: npm run test:run